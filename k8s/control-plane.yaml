# Control plane — Hermes AIAgent runs inside this Deployment (single replica).
# Terminal/tool sandboxing is Hermes' own docker/ssh backend on the node (mount docker.sock if needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: hermes-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: hermes-sa
      containers:
        - name: api
          image: agent-runtime:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
          envFrom:
            - secretRef:
                name: llm-secret
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: hermes-runtime
spec:
  type: NodePort
  selector:
    app: control-plane
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080

# Optional env overrides for the control-plane Deployment (envFrom).
#
# If Hermes credentials live only in ~/.hermes on the node, either:
#   - omit provider keys below (leave stringData empty / delete unused keys), or
#   - mount host ~/.hermes into the pod and do not set conflicting *_API_KEY env vars.
#
# Empty Secret keys can still override process env — prefer removing a key entirely
# rather than setting it to "".
apiVersion: v1
kind: Secret
metadata:
  name: llm-secret
  namespace: hermes-runtime
type: Opaque
stringData:
  HERMES_SKIP_MEMORY: "true"
  HERMES_SKIP_CONTEXT_FILES: "true"
  # OPENROUTER_API_KEY: "only-if-not-using-mounted-hermes-home"
